# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Keys marked "sync: false" are asked for once in the Render dashboard (never commit real passwords).
services:
  - type: web
    name: food-booking-system
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"

