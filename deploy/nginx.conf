worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
    access_log off;
    client_max_body_size 20m;
    # Keep the original scheme from the hosting proxy (https) so the apps build correct links.
    map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        location = /admin { return 302 /admin/; }
        location /admin/ { proxy_pass http://127.0.0.1:5001; }
        location / { proxy_pass http://127.0.0.1:5000; }
    }
}
